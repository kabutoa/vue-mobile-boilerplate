<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
    <style>
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      .app-loading::after {
        width: 32px;
        aspect-ratio: 1;
        border: 3px solid rgb(23 23 23 / 18%);
        border-top-color: #171717;
        border-radius: 50%;
        content: '';
        animation: app-loading-spin 0.7s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading" role="status" aria-label="loading"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
